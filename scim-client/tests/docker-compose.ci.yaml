# CI runs the images the build stage pushed. Without build:, a failed pull fails the job instead of building silently.
services:
  scim-dev-server:
    build: !reset null
  scim-server:
    build: !reset null
  test:
    build: !reset null
  test-integration:
    build: !reset null
