# CI runs the images the build stage pushed. Without build:, a failed pull fails the job instead of building silently.
services:
  scim-server-reference:
    build: !reset null
  scim-server-univention:
    build: !reset null
  test-against-univention-server:
    build: !reset null
  test-against-reference-server:
    build: !reset null
  test-against-wire-com:
    build: !reset null
