x-test-against-reference-server: &test-against-reference-server-template
  build:
    context: ../../
    dockerfile: docker/scim-client/Dockerfile
    target: test
  image: gitregistry.knut.univention.de/univention/dev/projects/scim/scim-services/scim-client-testrunner:${IMAGE_TAG:-latest}
  profiles:
    - test-reference-server
  depends_on:
    udm-rest-api:
      condition: service_healthy
    keycloak:
      condition: service_started
    udm-listener:
      condition: service_started
    prefill:
      condition: service_started
    udm-transformer:
      condition: service_started
    dispatcher:
      condition: service_started
    scim-server-reference:
      condition: service_healthy
  environment: &test-against-reference-server-env
    SCIM_SERVER_BASE_URL: http://scim-server-reference:8080/
    PROVISIONING_DB: sqlite:////tmp/scim-client.db
    PROVISIONING_API_BASE_URL: http://provisioning-api:7777/
    PROVISIONING_API_USERNAME: scim-client
    PROVISIONING_API_PASSWORD: univention
    PROVISIONING_API_ADMIN_USERNAME: admin
    PROVISIONING_API_ADMIN_PASSWORD: provisioning
    LOG_LEVEL: DEBUG
    MAX_ACKNOWLEDGEMENT_RETRIES: 10
    UDM_BASE_URL: http://udm-rest-api:9979/udm/
    UDM_USERNAME: cn=admin
    UDM_PASSWORD: univention
    LDAP_HOST: ldap-server
    LDAP_BIND_DN: cn=admin,dc=univention-organization,dc=intranet
    LDAP_BIND_PASSWORD: univention
    EXTERNAL_ID_USER_MAPPING: univentionObjectIdentifier
    EXTERNAL_ID_GROUP_MAPPING: univentionObjectIdentifier
    USERNAME_MAPPING: username
    GROUP_SYNC_ENABLED: "true"
    KEYCLOAK_BASE_URL: "http://keycloak:8080"
    TESTCONF_RUN_WIRE_COM_INTEGRATION_TESTS: "false"

services:

  # UDM for the Univention SCIM server
  downstream-udm-rest-api:
    image: gitregistry.knut.univention.de/univention/dev/nubus-for-k8s/udm-rest-api/udm-rest-api:latest
    container_name: "downstream-udm-rest-api"
    platform: "linux/amd64"
    profiles:
      - dependencies-univention-server
      - test-univention-server
    depends_on:
      downstream-ldap-server:
        condition: service_healthy
    volumes:
      - ./conf/base-scim-server.conf:/etc/univention/base.conf:ro
    environment:
      DOMAINNAME: univention-organization.intranet
      HOSTNAME: localhost:9979
      LDAP_HOST: downstream-ldap-server
      LDAP_PORT: 389
      LDAP_BASE_DN: dc=univention-organization,dc=intranet
      LDAP_HOST_DN: cn=admin,dc=univention-organization,dc=intranet
      TLS_MODE: "off"
      MACHINE_SECRET: univention
      LDAP_CN_ADMIN_PW: univention
    ports:
      - 9999:9979
    healthcheck:
      test: ["CMD", "python3", "-c", "import sys, requests; sys.exit(0) if requests.get('http://localhost:9979/udm').status_code == 401 else sys.exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # LDAP for the Univention SCIM server
  downstream-ldap-server:
    platform: linux/amd64
    image: gitregistry.knut.univention.de/univention/dev/nubus-for-k8s/ldap/ldap-server:latest
    container_name: "downstream-ldap-server"
    profiles:
      - dependencies-univention-server
      - test-univention-server
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -H ldapi:/// -Y EXTERNAL -b \"cn=config\" -LLL \"(&(objectClass=mdb))\" dn"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    environment:
      LDAP_CN_ADMIN_PW: univention
      LDAP_BASEDN: "dc=univention-organization,dc=intranet"
      PYTHON_LOG_LEVEL: "DEBUG"
      UPDATE_INDEX_ON_STARTUP: "true"
    ports:
      - 3389:389
    volumes:
      # Mounted as base.conf, not base-defaults.conf, so the image's own defaults layer still applies.
      - ./conf/base-scim-server.conf:/etc/univention/base.conf:ro

  # Univention SCIM server implementation to test against.
  scim-server-univention:
    build:
      context: ../../
      dockerfile: docker/scim-server/Dockerfile
      target: final
    image: gitregistry.knut.univention.de/univention/dev/projects/scim/scim-services/scim-server:${IMAGE_TAG:-latest}
    container_name: "scim-server-univention"
    profiles:
      - dependencies-univention-server
      - test-univention-server
    environment:
      UDM_URL: http://downstream-udm-rest-api:9979/udm/
      UDM_USERNAME: cn=admin
      UDM_PASSWORD: univention
      AUTH_ENABLED: "false"
      API_PREFIX: /v2
      LOG_LEVEL: DEBUG
      EXTERNAL_ID_USER_MAPPING: description
      EXTERNAL_ID_GROUP_MAPPING: description
      ADD_LDAP_ATTRIBUTES: "true"
    ports:
      - 8888:8000
    depends_on:
      downstream-udm-rest-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import sys, requests; sys.exit(0) if requests.get('http://localhost:8000/v2/ServiceProviderConfig').status_code == 200 else sys.exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    command: uvicorn univention.scim.server.main:app --host 0.0.0.0 --port 8000

  # Reference SCIM server implementation to test against.
  scim-server-reference:
    platform: linux/amd64
    build:
      context: ../../
      dockerfile: docker/scim-dev-server/Dockerfile
    image: gitregistry.knut.univention.de/univention/dev/projects/scim/scim-services/scim-dev-server:${IMAGE_TAG:-latest}
    container_name: "scim-server-reference"
    profiles:
      - dependencies-reference-server
      - test-reference-server
    ports:
      - 8888:8080
    healthcheck:
      test: ["CMD", "python3", "-c", "import sys, requests; sys.exit(0) if requests.get('http://localhost:8080/ServiceProviderConfig').status_code == 200 else sys.exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  provisioning-api:
    image: gitregistry.knut.univention.de/univention/dev/projects/provisioning/provisioning-api:latest
    container_name: "provisioning-api-dev"
    restart: "on-failure"
    profiles:
      - dependencies-univention-server
      - test-univention-server
      - dependencies-reference-server
      - test-reference-server
    environment:
      LOG_LEVEL: "DEBUG"
      NATS_HOST: "nats"
      NATS_PORT: "4222"
      NATS_USER: "api"
      NATS_PASSWORD: "apipass"
      ADMIN_NATS_USER: "admin"
      ADMIN_NATS_PASSWORD: "nimda"
      UDM_HOST: "udm-rest-api"
      UDM_PORT: 9979
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "provisioning"
      PREFILL_USERNAME: "prefill"
      PREFILL_PASSWORD: "prefillpass"
      MAX_PREFILL_ATTEMPTS: 5
      EVENTS_USERNAME_UDM: "udm"
      EVENTS_PASSWORD_UDM: "udmpass"
      DEBUG: "false"
      ROOT_PATH: "/"
      CORS_ALL: "false"
    depends_on:
      nats:
        condition: service_started
    ports:
      - "7777:7777"

  nats:
    image: "nats:latest"
    container_name: nats
    profiles:
      - dependencies-univention-server
      - test-univention-server
      - dependencies-reference-server
      - test-reference-server
    environment:
      jetstream: "enabled"
    ports:
      - "4222:4222"
      - "8222:8222" # HTTP monitoring port
    volumes:
      - ./conf/nats.dev.conf:/etc/nats-config/nats.conf
      - type: tmpfs
        target: /var/run
    command: --name nats --cluster_name JetStreamCluster --jetstream -m 8222 -p 4222 -config /etc/nats-config/nats.conf

  dispatcher:
    image: gitregistry.knut.univention.de/univention/dev/projects/provisioning/provisioning-dispatcher:latest
    container_name: "provisioning-dispatcher"
    restart: "on-failure"
    profiles:
      - dependencies-univention-server
      - test-univention-server
      - dependencies-reference-server
      - test-reference-server
    environment:
      LOG_LEVEL: "DEBUG"
      NATS_HOST: "nats"
      NATS_PORT: "4222"
      NATS_USER: "dispatcher"
      NATS_PASSWORD: "dispatcherpass"
      NATS_MAX_RECONNECT_ATTEMPTS: 2
      PROVISIONING_API_HOST: "provisioning-api"
      PROVISIONING_API_PORT: 7777
      NATS_CONSUMER_NAME: "incoming"
    depends_on:
      nats:
        condition: service_started
      provisioning-api:
        condition: service_started

  udm-transformer:
    image: "gitregistry.knut.univention.de/univention/dev/projects/provisioning/provisioning-udm-transformer:latest"
    container_name: "provisioning-udm-transformer"
    restart: "on-failure"
    profiles:
      - dependencies-univention-server
      - test-univention-server
      - dependencies-reference-server
      - test-reference-server
    environment:
      LOG_LEVEL: "DEBUG"
      NATS_HOST: "nats"
      NATS_PORT: "4222"
      NATS_USER: "udm-transformer"
      NATS_PASSWORD: "udm-transformerpass"
      LDAP_PUBLISHER_NAME: "udm-listener"
      PROVISIONING_API_HOST: "provisioning-api"
      PROVISIONING_API_PORT: 7777
      EVENTS_USERNAME_UDM: "udm"
      EVENTS_PASSWORD_UDM: "udmpass"
      LDAP_HOST: "ldap-server"
      LDAP_PORT: 389
      LDAP_TLS_MODE: "off"
      LDAP_BASE_DN: "dc=univention-organization,dc=intranet"
      LDAP_BIND_DN: "cn=admin,dc=univention-organization,dc=intranet"
      LDAP_BIND_PW: "univention"
      UDM_URL: "http://udm-rest-api:9979/udm"
      UDM_USERNAME: "cn=admin"
      UDM_PASSWORD: "univention"
      UDM_NEEDS_RELOAD: "false"
    depends_on:
      nats:
        condition: service_started
      provisioning-api:
        condition: service_started
      udm-rest-api:
        condition: service_healthy

  prefill:
    image: "gitregistry.knut.univention.de/univention/dev/projects/provisioning/provisioning-prefill:latest"
    container_name: "provisioning-prefill"
    restart: "on-failure"
    profiles:
      - dependencies-univention-server
      - test-univention-server
      - dependencies-reference-server
      - test-reference-server
    environment:
      LOG_LEVEL: "DEBUG"
      NATS_HOST: "nats"
      NATS_PORT: "4222"
      PROVISIONING_API_HOST: "provisioning-api"
      PROVISIONING_API_PORT: 7777
      NATS_USER: "prefill"
      NATS_PASSWORD: "prefillpass"
      NATS_MAX_RECONNECT_ATTEMPTS: 2
      UDM_PROTOCOL: "http"
      UDM_URL_PATH_PREFIX: ""
      UDM_HOST: "udm-rest-api"
      UDM_PORT: 9979
      UDM_USERNAME: "cn=admin"
      UDM_PASSWORD: "univention"
      PREFILL_USERNAME: "prefill"
      PREFILL_PASSWORD: "prefillpass"
      MAX_PREFILL_ATTEMPTS: 5
      NETWORK_RETRY_STARTING_INTERVAL: 0.1
      NETWORK_RETRY_MAX_DELAY: 1
      NETWORK_RETRY_MAX_ATTEMPTS: 5
    depends_on:
      nats:
        condition: service_started
      provisioning-api:
        condition: service_started

  udm-listener:
    image: "gitregistry.knut.univention.de/univention/dev/projects/provisioning/provisioning-udm-listener:latest"
    container_name: "udm-listener"
    restart: "on-failure"
    profiles:
      - dependencies-univention-server
      - test-univention-server
      - dependencies-reference-server
      - test-reference-server
    environment:
      NATS_HOST: "nats"
      NATS_PORT: "4222"
      NATS_USER: ldif-producer
      NATS_PASSWORD: ldifpass
      NATS_MAX_RECONNECT_ATTEMPTS: 2
      NATS_RETRY_DELAY: 10
      NATS_MAX_RETRY_COUNT: 3
      TERMINATE_LISTENER_ON_EXCEPTION: "true"
      LDAP_HOST: "ldap-server"
      LDAP_BASE_DN: "dc=univention-organization,dc=intranet"
      LDAP_HOST_DN: "cn=admin,dc=univention-organization,dc=intranet"
      NOTIFIER_SERVER: "ldap-notifier"
      DEBUG_LEVEL: "3"
      TLS_MODE: "off"
      LDAP_PASSWORD: "univention"
      LDAP_PASSWORD_FILE: "/var/secrets/ldap_password"
      LDAP_PORT: 389
    depends_on:
      nats:
        condition: service_started
      ldap-server:
        condition: service_healthy
      ldap-notifier:
        condition: service_started
    volumes:
      - /etc/ldap/

  ldap-notifier:
    platform: linux/amd64
    image: gitregistry.knut.univention.de/univention/dev/nubus-for-k8s/ldap/ldap-notifier:latest
    container_name: "ldap-notifier"
    profiles:
      - dependencies-univention-server
      - test-univention-server
      - dependencies-reference-server
      - test-reference-server
    depends_on:
      ldap-server:
        condition: service_healthy
    ports:
      - 6669:6669
    volumes:
      - ldap-shared-data:/var/lib/univention-ldap/:rw
      - ldap-shared-run:/var/run/slapd/:ro

  ldap-server:
    platform: linux/amd64
    image: gitregistry.knut.univention.de/univention/dev/nubus-for-k8s/ldap/ldap-server:latest
    container_name: "ldap-server"
    profiles:
      - dependencies-univention-server
      - test-univention-server
      - dependencies-reference-server
      - test-reference-server
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -H ldapi:/// -Y EXTERNAL -b \"cn=config\" -LLL \"(&(objectClass=mdb))\" dn"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    environment:
      LDAP_CN_ADMIN_PW: univention
      LDAP_BASEDN: "dc=univention-organization,dc=intranet"
      PYTHON_LOG_LEVEL: "DEBUG"
      UPDATE_INDEX_ON_STARTUP: "true"
    ports:
      - 389:389
      - 636:636
    volumes:
      - ldap-shared-data:/var/lib/univention-ldap/:rw
      - ldap-shared-run:/var/run/slapd/:rw
      # Mounted as base.conf, not base-defaults.conf, so the image's own defaults layer still applies.
      - ./conf/base-defaults.conf:/etc/univention/base.conf:ro

  udm-rest-api:
    image: gitregistry.knut.univention.de/univention/dev/nubus-for-k8s/udm-rest-api/udm-rest-api:latest
    container_name: "udm-rest-api"
    platform: "linux/amd64"
    profiles:
      - dependencies-univention-server
      - test-univention-server
      - dependencies-reference-server
      - test-reference-server
    depends_on:
      ldap-server:
        condition: service_healthy
    ports:
      - 9979:9979
    volumes:
      - ./conf/base.conf:/etc/univention/base.conf:ro
    environment:
      DOMAINNAME: univention-organization.intranet
      HOSTNAME: localhost:9979
      LDAP_HOST: ldap-server
      LDAP_PORT: 389
      LDAP_BASE_DN: dc=univention-organization,dc=intranet
      LDAP_HOST_DN: cn=admin,dc=univention-organization,dc=intranet
      TLS_MODE: "off"
      MACHINE_SECRET: univention
      LDAP_CN_ADMIN_PW: univention
      DEBUG_LEVEL: 99
    healthcheck:
      test: ["CMD", "python3", "-c", "import sys, requests; sys.exit(0) if requests.get('http://localhost:9979/udm').status_code == 401 else sys.exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  keycloak:
    image: artifacts.software-univention.de/nubus-dev/images/keycloak:0.2.0-post-main
    container_name: keycloak-test
    profiles:
      - dependencies-univention-server
      - test-univention-server
      - dependencies-reference-server
      - test-reference-server
    command: start-dev --http-enabled=true --import-realm
    ports:
      - 5050:8080
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=univention
      - PROXY_ADDRESS_FORWARDING=true
      - KC_PROXY=edge
      - KEYCLOAK_LOGLEVEL=ALL
      - ROOT_LOGLEVEL=ALL

  test-against-univention-server:
    build:
      context: ../../
      dockerfile: docker/scim-client/Dockerfile
      target: test
    image: gitregistry.knut.univention.de/univention/dev/projects/scim/scim-services/scim-client-testrunner:${IMAGE_TAG:-latest}
    profiles:
      - test-univention-server
    depends_on:
      udm-rest-api:
        condition: service_healthy
      udm-listener:
        condition: service_started
      prefill:
        condition: service_started
      udm-transformer:
        condition: service_started
      dispatcher:
        condition: service_started
      scim-server-univention:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      SCIM_SERVER_BASE_URL: http://scim-server-univention:8000/v2/
      PROVISIONING_DB: sqlite:////tmp/scim-client.db
      PROVISIONING_API_BASE_URL: http://provisioning-api:7777/
      PROVISIONING_API_USERNAME: scim-client
      PROVISIONING_API_PASSWORD: univention
      PROVISIONING_API_ADMIN_USERNAME: admin
      PROVISIONING_API_ADMIN_PASSWORD: provisioning
      LOG_LEVEL: DEBUG
      MAX_ACKNOWLEDGEMENT_RETRIES: 10
      UDM_BASE_URL: http://udm-rest-api:9979/udm/
      UDM_USERNAME: cn=admin
      UDM_PASSWORD: univention
      LDAP_HOST: ldap-server
      LDAP_BIND_DN: cn=admin,dc=univention-organization,dc=intranet
      LDAP_BIND_PASSWORD: univention
      EXTERNAL_ID_USER_MAPPING: univentionObjectIdentifier
      EXTERNAL_ID_GROUP_MAPPING: univentionObjectIdentifier
      USERNAME_MAPPING: username
      GROUP_SYNC_ENABLED: "true"
      KEYCLOAK_BASE_URL: "http://keycloak:8080"
      TESTCONF_RUN_WIRE_COM_INTEGRATION_TESTS: "false"
      #
      # Configuration for tests with Univention SCIM server
      #
      TESTCONF_UNIVENTION_SCIM_SERVER: "true"
      TESTCONF_DOWNSTREAM_UDM_BASE_URL: http://downstream-udm-rest-api:9979/udm/
      TESTCONF_DOWNSTREAM_UDM_USERNAME: cn=admin
      TESTCONF_DOWNSTREAM_UDM_PASSWORD: univention

  test-against-reference-server:
    <<: *test-against-reference-server-template

  test-against-wire-com:
    <<: *test-against-reference-server-template
    command: ["-m", "wire_com_integration_tests"]
    environment:
      <<: *test-against-reference-server-env
      TESTCONF_RUN_WIRE_COM_INTEGRATION_TESTS: "true"
      TESTCONF_WIRE_COM_SCIM_BEARER_TOKEN:

volumes:
  ldap-shared-data:
  ldap-shared-run:
  pre-commit-cache:
