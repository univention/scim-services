{{- if eq .Values.scimServer.auth.method "oidc" }}
{{- $_ := required "A SCIM server password is required, see parameter scimServer.auth." (coalesce .Values.scimServer.auth.password (.Values.scimServer.auth.existingSecret).name) }}
{{- if not (.Values.scimServer.auth.existingSecret).name }}
{{- $name := include "nubus-common.secrets.name" (dict "defaultNameSuffix" "scim-server" "context" .) -}}
---
kind: "Secret"
apiVersion: "v1"
metadata:
  name: {{ $name }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    {{- include "common.labels.standard" ( dict "customLabels" .Values.additionalLabels "context" . ) | nindent 4 }}
  {{- include "nubus-common.annotations.render" ( dict
    "values" ( list .Values.additionalAnnotations )
    "context" . )
    | nindent 2 }}
type: Opaque
stringData:
  password: {{ include "nubus-common.secrets.passwords.manage"
  (dict
    "secret" $name
    "key" "password"
    "username" "scim-client-scim-server"
    "providedValues" (list "scimServer.auth.password")
    "context" .
  )
| quote }}
{{- end }}
{{- else if eq .Values.scimServer.auth.method "basic" }}
{{- $_ := required "A SCIM server basic-auth password is required, see parameter scimServer.auth.basicAuth." (coalesce .Values.scimServer.auth.basicAuth.password (.Values.scimServer.auth.basicAuth.existingSecret).name) }}
{{- if not (.Values.scimServer.auth.basicAuth.existingSecret).name }}
{{- $name := include "nubus-common.secrets.name" (dict "defaultNameSuffix" "scim-server" "context" .) -}}
---
kind: "Secret"
apiVersion: "v1"
metadata:
  name: {{ $name }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    {{- include "common.labels.standard" ( dict "customLabels" .Values.additionalLabels "context" . ) | nindent 4 }}
  {{- include "nubus-common.annotations.render" ( dict
    "values" ( list .Values.additionalAnnotations )
    "context" . )
    | nindent 2 }}
type: Opaque
stringData:
  password: {{ include "nubus-common.secrets.passwords.manage"
  (dict
    "secret" $name
    "key" "password"
    "username" "scim-client-scim-server"
    "providedValues" (list "scimServer.auth.basicAuth.password")
    "context" .
  )
| quote }}
{{- end }}
{{- else if eq .Values.scimServer.auth.method "bearer" }}
{{- $_ := required "A SCIM server bearer token is required, see parameter scimServer.auth.bearerAuth." (coalesce .Values.scimServer.auth.bearerAuth.token (.Values.scimServer.auth.bearerAuth.existingSecret).name) }}
{{- if not (.Values.scimServer.auth.bearerAuth.existingSecret).name }}
{{- $name := include "nubus-common.secrets.name" (dict "defaultNameSuffix" "scim-server" "context" .) -}}
---
kind: "Secret"
apiVersion: "v1"
metadata:
  name: {{ $name }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    {{- include "common.labels.standard" ( dict "customLabels" .Values.additionalLabels "context" . ) | nindent 4 }}
  {{- include "nubus-common.annotations.render" ( dict
    "values" ( list .Values.additionalAnnotations )
    "context" . )
    | nindent 2 }}
type: Opaque
stringData:
  token: {{ include "nubus-common.secrets.passwords.manage"
  (dict
    "secret" $name
    "key" "token"
    "username" "scim-client-scim-server"
    "providedValues" (list "scimServer.auth.bearerAuth.token")
    "context" .
  )
| quote }}
{{- end }}
{{- end }}
