include:
  - project: "univention/dev/nubus-for-k8s/common-ci"
    ref: "v1.72.0"
    file:
      - "defaults/stages.yaml"
      - "defaults/nubus-workflow.yaml"
      - "jobs/lint-pre-commit.yaml"
      - "jobs/lint-commit-messages.yaml"
      - "jobs/semantic-release-env.yaml"
      - "jobs/container-build-external-buildkit.yaml"
      - "jobs/package-and-publish-helm-charts-external.yaml"
      - "jobs/check-debian-updates.yaml"
      - "templates/compose-test.yaml"

  - component: "$CI_SERVER_FQDN/univention/dev/nubus-for-k8s/common-ci/vul-man@v1.72.0"
    inputs:
      helm_chart_name: "scim-client"
      helm_values: "--helm-values ${CI_PROJECT_DIR}/helm/scim-client/linter_values.yaml"

variables:
  RENOVATE_USER_ID: "1393"

lint-pre-commit:
  before_script:
    # Compose lint would fail without the referenced env files
    - helm repo add bitnami https://charts.bitnami.com/bitnami

generate-docs-pipeline-config:
  stage: prepare
  image:
    name: docker-registry.knut.univention.de/knut/deb-builder@sha256:b1b9f7be8795fbc3e920d9a4bb2f7dddce85d032a06d0d885a78bf5a39222c7d
    entrypoint: [""]
  script:
    - >
      .gitlab-ci/doc-builder
      --yaml .gitlab-ci/base-doc.yml
      --out generated-config-doc.yml
  rules:
    - changes: &changes-docs
        - "docs/**/*"
  artifacts:
    paths:
      - generated-config-doc.yml

trigger-docs:
  stage: "build"
  needs:
    - job: generate-docs-pipeline-config
  trigger:
    strategy: "depend"
    include:
      - artifact: generated-config-doc.yml
        job: generate-docs-pipeline-config
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: "never"
    - if: $CI_COMMIT_REF_NAME != $CI_DEFAULT_BRANCH
      changes: *changes-docs
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      changes: *changes-docs

.build-matrix: &build-matrix
  - IMAGE_NAME: "scim-server"
    BUILD_CONTEXT: $CI_PROJECT_DIR
    DOCKERFILE_PATH: "docker/scim-server/Dockerfile"
  - IMAGE_NAME: "testrunner"
    BUILD_CONTEXT: $CI_PROJECT_DIR
    DOCKERFILE_PATH: "docker/scim-server/Dockerfile"
    BUILD_TARGET: "test"
  - IMAGE_NAME: "scim-client-testrunner"
    BUILD_CONTEXT: $CI_PROJECT_DIR
    DOCKERFILE_PATH: "docker/scim-client/Dockerfile"
    BUILD_TARGET: "test"
  - IMAGE_NAME: "scim-client"
    BUILD_CONTEXT: $CI_PROJECT_DIR
    DOCKERFILE_PATH: "docker/scim-client/Dockerfile"
  - IMAGE_NAME: "scim-dev-server"
    BUILD_CONTEXT: $CI_PROJECT_DIR
    DOCKERFILE_PATH: "docker/scim-dev-server/Dockerfile"

# Separate publish matrix to accomodate testrunner images
# that should not be mirrored to artifacts.software-univention.de
.publish-matrix: &publish-matrix
  - IMAGE_NAME:
      - "scim-server"
      - "scim-client"

container-build:
  parallel:
    matrix: *build-matrix

container-malware-scan:
  parallel:
    matrix: *publish-matrix

push-image-external:
  parallel:
    matrix: *publish-matrix

container-sign-external:
  parallel:
    matrix: *publish-matrix

container-release-attestation:
  parallel:
    matrix: *publish-matrix

check-debian-updates:
  parallel:
    matrix: *build-matrix
  variables:
    TARGET_IMAGE: "${CI_REGISTRY_IMAGE}/${IMAGE_NAME}:latest"

test-unit-and-integration:
  extends: ".compose-test"
  stage: test
  variables:
    COMPOSE_TEST_DIR: "scim-server/tests"
    COMPOSE_FILE: "docker-compose.yml:docker-compose.ci.yml"
    COMPOSE_TEST_SERVICES: "ldap-server udm-rest-api"
    COMPOSE_TEST_WAIT_TIMEOUT: "180"
  script:
    - docker compose run --quiet-pull --name test-unit-and-integration test
  after_script:
    - docker cp test-unit-and-integration:/tmp/scim-coverage.xml ./coverage-test-unit-and-integration.xml
    - docker cp test-unit-and-integration:/tmp/pytest-junit.xml ./pytest-junit-test-unit-and-integration.xml
    - !reference [".compose-test", "after_script"]
  artifacts:
    paths:
      - compose-logs/
      - coverage-test-unit-and-integration.xml
      - pytest-junit-test-unit-and-integration.xml
    reports:
      junit: pytest-junit-test-unit-and-integration.xml

test-scim2-compliance:
  extends: ".compose-test"
  stage: test
  variables:
    COMPOSE_TEST_DIR: "scim-server/tests"
    COMPOSE_FILE: "docker-compose.yml:docker-compose.ci.yml"
    COMPOSE_TEST_SERVICES: "ldap-server udm-rest-api scim-server"
    COMPOSE_TEST_WAIT_TIMEOUT: "180"
  script:
    - docker compose run scim2-tester | tee scim2-tester.log 2>&1
  artifacts:
    paths:
      - compose-logs/
      - scim-server/tests/scim2-tester.log

test-helm-charts:
  stage: test
  image: gitregistry.knut.univention.de/univention/dev/nubus-for-k8s/common-helm/testrunner:0.29.10@sha256:5cba2a8fc4c6d5fa82bcec177ad433ab74695b4e02b2a2e9ed9b53c734b34dbf
  script:
    - helm dep build helm/scim-server
    - helm dep build helm/scim-client
    - pytest tests/helm_unit/scim_server
    - pytest tests/helm_unit/scim_client

test-scim-client:
  extends: ".compose-test"
  stage: test
  variables:
    COMPOSE_TEST_DIR: "scim-client/tests"
    COMPOSE_FILE: "docker-compose.yaml:docker-compose.ci.yaml"
    COMPOSE_PROFILES: "test"
    # The dependencies of the test service; naming the stack keeps the test runner itself out of `up`.
    COMPOSE_TEST_SERVICES: "scim-dev-server udm-rest-api udm-listener keycloak prefill udm-transformer dispatcher"
    COMPOSE_TEST_WAIT_TIMEOUT: "180"
  script:
    - docker compose run --quiet-pull --name test-scim-client test
  after_script:
    - docker cp test-scim-client:/tmp/pytest-junit.xml ./pytest-junit-test-scim-client.xml
    - docker cp test-scim-client:/tmp/scim-coverage.xml ./coverage-test-scim-client.xml
    - !reference [".compose-test", "after_script"]
  artifacts:
    paths:
      - compose-logs/
      - coverage-test-scim-client.xml
      - pytest-junit-test-scim-client.xml
    reports:
      junit: pytest-junit-test-scim-client.xml

test-scim-server-and-client-integration:
  extends: ".compose-test"
  stage: test
  variables:
    COMPOSE_TEST_DIR: "scim-client/tests"
    COMPOSE_FILE: "docker-compose.yaml:docker-compose.ci.yaml"
    COMPOSE_PROFILES: "test-integration"
    # The dependencies of the test-integration service, without the test runner itself.
    COMPOSE_TEST_SERVICES: "scim-server udm-rest-api udm-listener keycloak prefill udm-transformer dispatcher"
    COMPOSE_TEST_WAIT_TIMEOUT: "180"
  script:
    - docker compose run --quiet-pull --name test-integration-scim-services test-integration

sonarqube-scan:
  stage: analysis
  # needs:
    #- test-unit-and-integration
    #- test-scim-client
  when: always # Runs the job even if a earlier job in the stage fails.
  image:
      name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/sonarsource/sonar-scanner-cli:11
      entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
    GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"
      - sonar-scanner/
  script:
    - sonar-scanner -Dsonar.host.url="${SONAR_HOST_URL}"
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true"
