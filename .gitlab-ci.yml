.changes-container:
  changes: &changes-container
    - ".gitlab-ci.yml"
    - ".gitlab-ci/**/*"
    - ".pre-commit-config.yaml"
    - "docker/**/*"
    - "docker-compose.yaml"
    - "helm/**/*"
    - "pyproject.toml"
    - "scim-client/**/*"
    - "scim-server/**/*"
    - "scim-udm-transformer-lib/**/*"
    - "scripts/**/*"
    - "sonar-project.properties"
    - "tests/**/*"
    - "Tiltfile"
    - "tilt-values.yaml"
    - "uv.lock"

include:
  - project: "univention/dev/nubus-for-k8s/common-ci"
    ref: "v1.72.0"
    file:
      - "defaults/stages.yaml"
      - "defaults/nubus-workflow.yaml"
      - "jobs/lint-pre-commit.yaml"
      - "jobs/lint-commit-messages.yaml"
      - "jobs/semantic-release-env.yaml"

  - local: ".gitlab-ci/product-jobs.yml"
    rules:
      - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        changes: *changes-container
      - if: '$CI_PIPELINE_SOURCE != "merge_request_event"'

variables:
  RENOVATE_USER_ID: "1393"

lint-pre-commit:
  before_script:
    # Compose lint would fail without the referenced env files
    - helm repo add bitnami https://charts.bitnami.com/bitnami

generate-docs-pipeline-config:
  stage: prepare
  image:
    name: docker-registry.knut.univention.de/knut/deb-builder@sha256:b1b9f7be8795fbc3e920d9a4bb2f7dddce85d032a06d0d885a78bf5a39222c7d
    entrypoint: [""]
  script:
    - >
      .gitlab-ci/doc-builder
      --yaml .gitlab-ci/base-doc.yml
      --out generated-config-doc.yml
  rules:
    - changes: &changes-docs
        - "docs/scim-client/**/*"
  artifacts:
    paths:
      - generated-config-doc.yml

trigger-docs:
  stage: "build"
  needs:
    - job: generate-docs-pipeline-config
  trigger:
    strategy: "depend"
    include:
      - artifact: generated-config-doc.yml
        job: generate-docs-pipeline-config
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: "never"
    - if: $CI_COMMIT_REF_NAME != $CI_DEFAULT_BRANCH
      changes: *changes-docs
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      changes: *changes-docs
